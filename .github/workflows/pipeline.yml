name: Pipeline Lesmódromo

# Roda a cada push na main e também pelo botão "Run workflow" na aba Actions
on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  # ETAPA 1: testes do backend Spring. Se falhar, nada sobe.
  testes:
    name: 1. Testes do backend (Maven)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21
          cache: maven
      - run: mvn -B test

  # ETAPA 2: gera a imagem Docker do backend e publica no Docker Hub
  imagem:
    name: 2. Imagem no Docker Hub
    needs: testes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}
      - uses: docker/build-push-action@v7
        with:
          context: ./backend
          push: true
          # "latest" para o Render achar a imagem, e o commit para cada versão ter um nome único
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/lesmodromo-api:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/lesmodromo-api:${{ github.sha }}
          build-args: |
            APP_VERSAO=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ETAPA 3: manda o Render trocar para a imagem nova e espera ela responder
  deploy-backend:
    name: 3. Deploy do backend no Render
    needs: imagem
    runs-on: ubuntu-latest
    steps:
      - name: Avisa o Render da imagem nova (com retry)
        env:
          HOOK: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
          IMAGEM: docker.io/${{ secrets.DOCKERHUB_USERNAME }}/lesmodromo-api:${{ github.sha }}
        run: |
          # tira espaços e quebras de linha que vêm junto quando o secret é colado
          HOOK=$(printf '%s' "$HOOK" | tr -d '[:space:]')
          if [ -z "$HOOK" ]; then
            echo "O secret RENDER_DEPLOY_HOOK_URL está vazio ou não existe."
            echo "Cadastre em Settings > Secrets and variables > Actions, com a URL do Deploy Hook do Render."
            exit 1
          fi
          IMAGEM_CODIFICADA=$(python3 -c "import sys, urllib.parse; print(urllib.parse.quote(sys.argv[1], safe=''))" "$IMAGEM")
          curl --fail --silent --show-error \
            --retry 5 --retry-delay 10 --retry-all-errors \
            -X POST "${HOOK}&imgURL=${IMAGEM_CODIFICADA}"
          echo "Render avisado: vai usar a imagem $IMAGEM"

      # RETRY 4: o Render demora alguns minutos para trocar a versão.
      # A pipeline fica perguntando /health até aparecer o commit novo.
      - name: Espera a nova versão subir (retry no health check)
        env:
          API_URL: ${{ secrets.API_URL }}
          COMMIT: ${{ github.sha }}
        run: |
          API_URL=$(printf '%s' "$API_URL" | tr -d '[:space:]')
          API_URL=${API_URL%/}
          if [ -z "$API_URL" ]; then
            echo "O secret API_URL está vazio ou não existe. Cadastre com a URL do Render, ex: https://lesmodromo-api.onrender.com"
            exit 1
          fi
          for tentativa in $(seq 1 40); do
            RESPOSTA=$(curl --silent --max-time 30 "$API_URL/health" || true)
            if echo "$RESPOSTA" | grep -q "$COMMIT"; then
              echo "Backend no ar com a versão $COMMIT (tentativa $tentativa)"
              echo "$RESPOSTA"
              exit 0
            fi
            echo "Tentativa $tentativa/40: versão nova ainda não respondeu, esperando 15s..."
            sleep 15
          done
          echo "O backend não subiu em 10 minutos"
          exit 1

  # ETAPA 4: gera o site do Expo web e publica na Vercel usando o token
  deploy-frontend:
    name: 4. Deploy do frontend na Vercel
    needs: deploy-backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 22

      # A URL da API vem do secret, não do código
      - name: Cria o .env com a URL da API
        env:
          API_URL: ${{ secrets.API_URL }}
        run: |
          API_URL=$(printf '%s' "$API_URL" | tr -d '[:space:]')
          echo "EXPO_PUBLIC_API_URL=${API_URL%/}" > .env

      - name: Instala a CLI da Vercel
        run: npm install --global vercel@latest

      - name: Baixa as configurações do projeto na Vercel
        run: vercel pull --yes --environment=production --token=${{ secrets.VERCEL_TOKEN }}

      - name: Build do Expo web
        run: vercel build --prod --token=${{ secrets.VERCEL_TOKEN }}

      - name: Publica na Vercel
        run: vercel deploy --prebuilt --prod --token=${{ secrets.VERCEL_TOKEN }}
